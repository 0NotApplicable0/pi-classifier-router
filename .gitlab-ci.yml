# Verify typecheck and the full test suite on every push.
#
# The suite is hermetic: it binds only 127.0.0.1 on an ephemeral port, makes no
# outbound request, and needs no API key. scripts/smoke-live.mjs is the one
# deliberate live probe and is NOT run here (it requires TYPESAFE_API_KEY).
#
# The Laya sidecar tests self-skip when python3 is absent, which is the case in
# this image, so no Python setup is needed.

image: node:24

stages:
  - verify
  - release

verify:
  stage: verify
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm test

# Bun is the runtime both hosts actually use, and it is the only one that ships a
# YAML parser, so this job is what exercises the .yml/.yaml config path that the
# Node job skips. The suite needs no dependencies (the type-only imports erase),
# so there is no install step.
verify-bun:
  stage: verify
  image: oven/bun:1
  script:
    - bun test tests/

# ---------------------------------------------------------------------------
# Release: pushing a vX.Y.Z tag creates the GitLab release automatically, after
# both verify jobs pass on the tag pipeline. The notes are generated from the
# commit messages since the previous tag (scripts/release-notes.mjs). npm
# publishing stays manual.
# ---------------------------------------------------------------------------

.on-version-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release-notes:
  stage: release
  extends: .on-version-tag
  variables:
    # The notes walk history back to the previous tag, so no shallow clone.
    GIT_DEPTH: 0
  script:
    # Tag pipelines fetch only their own tag; the previous one is needed too.
    - git fetch --tags --force --quiet
    - node scripts/release-notes.mjs "$CI_COMMIT_TAG" > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 1 week

release:
  stage: release
  extends: .on-version-tag
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - release-notes
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
